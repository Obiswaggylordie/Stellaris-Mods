# Strategic Resources

 sr_sdc: "Zei'a Super Dimension Core"
 sr_sdc_desc: "The Super Dimension Core is an alternate take on the Dimension Engine concept, by taking the Dimension Core and utilising tetradimensional engineering to produce a pocket universe within the core."

 sr_psi_energy: "Psionic Energy"
 sr_psi_energy_desc: "The fundamental psychic force of the universe, the same which composes ascended beings."

 sr_celestial_energy: "Celestial Energy"
 sr_celestial_energy_desc: "Celestial Energy is the true primordial life force of all things in the universe, anything living or animated holds Celestial Energy within themselves to some capacity. Anything from an ant, to robots, and entire stars. Celestial Energy is also commonly refered to as Life Energy, not to be confused with Nature Energy. The more or less saturated somehing is with Celestial Energy, the more or less life it is capable of holding."

# Technology

 tech_obi_wormhole: "Spatial Magic Theory"
 tech_obi_wormhole_desc: "Through our understanding of the Arcane, we've come to realise that we have the potential to fold subspace in any way we see fit, granting us many potential benefits."

# Bypass
 MAGIC_WORMHOLE_GALACTIC: "Magic Wormhole"
 MAGIC_WORMHOLE_GALACTIC_DESC: "An esoteric breach in space, sustained by supernatural means."

# Decisions
 # Dark Stuff
 decision_dark_world_expedition: "Dark World Expedition"
 decision_dark_world_expedition_desc: "Gather our best and brightest, arm them with our most advanced of technology, and send them to battle our foe for the sake of our world."

# Celestial Energy stuff
 # Deposits
 d_darkling_storm: "Dark Storm"
 d_darkling_storm_desc: "A massive storm of inter-dimensional flux, encompassing the entire planet. Anything entering it is likely to be struck by pure energy and disabled, or even vaporized."

 d_ecological_disaster: "Ecological Disaster"
 d_ecological_disaster_desc: "The massive shift of energies on this planet has caused a nigh apocalyptic transformation in biosphere, geology, and environment around the globe. Plains have turned to deserts, forests have devolved to shrubs, stone has crumbled to gravel. The chaos has broken the stability of the tectonic plates, causing harsh earthquakes and forcing new volcanoes to emerge from the crust, splitting lands and seas. The dark storm above forcing the weather to stay energetic, torriential downpour coming down to drown the surface in rain and snow, thunderstorms roll across the sky frying electronics and striking down anything meandering the ground, the winds tear small fliers asunder and ground avians, insects are steadily being annihilated by the millions every hour. As landmass grows unstable and sinks into the oceans, vast tsunamis crash into the seabanks and swallow up anything near them. Our time on this world is ending."

 d_darkling_sky_temple: "The Sky Temple"
 d_darkling_sky_temple_desc: "The Dark Stronghold of the Ing, the residence of their Emperor and the largest share of planetary energy which they have stolen from the light."

 d_darkling_rifts: "Dark Rifts"
 d_darkling_rifts_desc: "Inter-dimensional tears in space appear randomly around the planet, from them emerge black smoke-like creatures which seek to possess and control anything near them, be it flesh or machine."

 d_darkling_horde: "Darkling Horde"
 d_darkling_horde_desc: "A horde of Darklings in their true form, able to manifest themselves on worlds that have been sufficiently supplanted by their dark counterpart."

 # Darkling Storyline
 dark_world_events.3.name: "The Great Cataclysm"
 dark_world_events.3.desc: "A disaster has come to [This.GetName], life has been supernaturally struck from the surface. The ecosystem has been warped and now struggles to continue in its present state, the environment has shifted drastically and has rendered the planet quite inhospitable to its native population. And finally, a dark energized storm has shrouded the planet, largely obscuring sunlight and disrupting air and space traffic."

 dark_world_events.4.name: "The World Shakes"
 dark_world_events.4.desc: "The massive shift of energies on [This.GetName] has caused a nigh apocalyptic transformation in biosphere, geology, and environment around the globe. Plains have turned to deserts, forests have devolved to shrubs, stone has crumbled to gravel. The chaos has broken the stability of the tectonic plates, causing harsh earthquakes and forcing new volcanoes to emerge from the crust, splitting lands and seas. The dark storm above forcing the weather to stay energetic, torriential downpour coming down to drown the surface in rain and snow, thunderstorms roll across the sky frying electronics and striking down anything meandering the ground, the winds tear small fliers asunder and ground avians, insects are steadily being annihilated by the millions every hour. As landmass grows unstable and sinks into the oceans, vast tsunamis crash into the seabanks and swallow up anything near them."

 dark_world_events.5.name: "Terrible Rifts"
 dark_world_events.5.desc: "As if the great storm shrouding [This.GetName] was not enough, mysterious purple rifts have opened all over the planet. These rifts seem to cause electrical disturbances similar to the great storm around them, and they appear to radiate some kind of toxic energy which corrodes matter from our reality until it ceases to exist."

 dark_world_events.6.name: "Ecological Stabilisation"
 dark_world_events.6.desc: "The worst of the storms have settled, the seas are calmer, and recovery efforts are helping the biosphere adapt to the drastic changes in environment. [This.GetName] is our world, and we not allow it to succumb to darkness."

 dark_world_events.8.name: "Black Fog"
 dark_world_events.8.desc: "Blackness has emerged from the rifts, swirling through the air, morphing and stretching. It moves with uncanny will in defiance of winds or walls, it seeks out life and drowns it with itself. The darkness consuming the living and warping them into soldiers of our enemy, the thralls of the Darklings lay siege to [This.GetName]."

 dark_world_events.9.name: "Bravery or Stupidity"
 dark_world_events.9.desc: "Our scientists have closely studied the dark rifts of our enemy for some time, and have found ways of transferring probes intact to the other side. And what they found was a shadowed mirror of [This.GetName] itself! The science team eventually lost contact with the probe, its replacement confirmed that the first had simply deteriorated, and by the time the second probe lost contact, the first had been reduced to a pile of withered metal and dust. Clearly the corrosive energy of the rifts must be originating from this dark world. We have the technology, should we decide to send §Ymanned expeditions§! through the rifts we've found."

 dark_world_events.10.name: "Expedition Control"
 dark_world_events.10.desc: "We will pierce into the Dark World and vanquish our enemy, we will not lose our planet to these devouring parasites from the shadows."

 dark_world_events.10.name: "The Dark World"
 dark_world_events.10.desc: "Our first expedition has arrived, sensor telemetry from their equipment shows that the atmosphere has already begun to corrode their EVA suits, clearly even our most modern of protective gear can withstand this terrible environment. This place is hellish, a twisted copy of our world, the light cast from the expedition's spotters are all swallowed up quickly, giving them no true sight. The sky is shrouded in a storm far worse than anything we've seen produced elsewhere, clearly the final form of the dark storm shrouding the true planet outside this purgatory. The dark rift returns to its inactive state and we lose connection with the expedition."

 dark_world_events.11.name: "The face of our enemy"
 dark_world_events.11.desc: "Our telemetry is reconnected with the expedition, they are under attack from towering dark entities. The datastream from their suits quickly inform us that no possessions were at play, they were simply overwhelmed, by the true form of our invaders. A fleeing member from the expedition managed to leap through the rift before it closed once more, writhing in agony as their armour had fused with their body. The Dark World is beyond toxic, and now its creatures know that we can reach them."