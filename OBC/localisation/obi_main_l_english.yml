 origin_tooltip_obi_zeia: ""

 obi_dasha_system_initializer_NAME: "Dasha System"
 obi_dasha_system_initializer_DESC: "The home of the Precursors."

 origin_obi_pony: "The Magical Bubble"
 origin_obi_pony_desc: "Spawn in the cradle of the Quadrupedan Union, home to many nations such as Equestria, Griffonia, the Crystal Empire, and more."
 origin_tooltip_obi_pony: ""

